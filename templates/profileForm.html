{% extends 'base.html' %}
{%block content%}

    <h2>user profile!:</h2>

    {% if error %}
        <p class="error">{{error}}</p>
    {% endif %}

    <form method="POST">
        <div>
            <label for="name">Name *:</label>
            <input type="text" id="name" name="name" required/>
        </div>
        <div>
            <label for="email">Email *:</label>
            <input type="email" id="email" name="email" required/>
        </div>
        <div>
            <label for="quan">quantity *:</label>
            <input type="number" id="quan" name="quan" min="1" max="10" required/>
        </div>
        <div>
            <label for="rel">relationship to me (im single, ladies) *:</label>
            <select id="rel" name="rel" required>
                <option value="">What is guest's relationship to me?</option>
                <option value="parent">Parent/Parent-in-Law</option>
                <option value="admirer">Secret admirer</option>
                <option value="sibling">Sibling/Sibling-in-law</option>
                <option value="buddy">Gambling buddy</option>
                <option value="coworker">Coworker</option>
                <option value="memory">somebody that i used to know (but you didnt have to cut me off)</option>
                <option value="other">other (lame)</option>
            </select>
        </div>
        <div>
            <label for="comments">Comments or Issues:</label>
            <textarea id="comments" name="comments" rows="4"></textarea>
        </div>
        <div>
            <label for="accomodations">Accomodations required?</label>
            <input type="checkbox" id="accomodations" name="accomodations" value="yes"/>
        </div>
        <button type="submit">update profile</button>
    </form>

{%endblock content%}
