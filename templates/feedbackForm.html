{% extends 'base.html'%}

{%block content%}

<h2>feedback form</h2>
<form method="post">
    <div>
        <label for="rating">Rate this event 1-5</label>
        <input type="number" id="rating" name="rating" min="1" max="5" rating/>
    </div>
    <div>
        <label for="feedback">Your feedback</label>
        <textarea name="feedback" id="feedback" rows="4" placeholder="Tell us what you thought"></textarea>
        <button type="submit">Submit Feedback</button>
    </div>
</form>

{%endblock content%}
